<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пробирки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8ebf3;
  --bg2:#dde2ee;
  --panel:#ffffff;
  --ink:#1b2136;
  --muted:#6b7392;
  --rim:#b9c0d4;
  --rim-strong:#8d97b5;
  --shadow:rgba(27,33,54,.16);
  --focus:#2f6df0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151930;
    --bg2:#101427;
    --panel:#1e2440;
    --ink:#eef1fa;
    --muted:#98a1c2;
    --rim:#3c4568;
    --rim-strong:#5a648f;
    --shadow:rgba(0,0,0,.45);
    --focus:#7aa2ff;
  }
}
:root[data-theme="dark"]{
  --bg:#151930;
  --bg2:#101427;
  --panel:#1e2440;
  --ink:#eef1fa;
  --muted:#98a1c2;
  --rim:#3c4568;
  --rim-strong:#5a648f;
  --shadow:rgba(0,0,0,.45);
  --focus:#7aa2ff;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:radial-gradient(120% 80% at 50% 0%, var(--bg) 0%, var(--bg2) 100%);
  color:var(--ink);
  font-family:"Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  padding:18px 14px 28px;
}
.app{width:100%;max-width:620px;display:flex;flex-direction:column;gap:18px}

header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0}
.stats{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.stats b{display:block;font-size:19px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.1}

.board{
  position:relative;
  background:var(--panel);
  border:1px solid var(--rim);
  border-radius:20px;
  padding:26px 16px 20px;
  box-shadow:0 10px 30px -18px var(--shadow);
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:16px 14px;
  min-height:240px;
  align-items:flex-end;
}

.tube{
  --w:52px;
  width:var(--w);
  padding:5px;
  background:none;
  border:2px solid var(--rim-strong);
  border-top:none;
  border-radius:4px 4px 26px 26px;
  cursor:pointer;
  position:relative;
  display:flex;flex-direction:column-reverse;
  gap:0;
  transition:transform .16s ease;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
.tube::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  border-radius:inherit;
  background:linear-gradient(105deg, rgba(255,255,255,.42) 0 18%, rgba(255,255,255,0) 34% 72%, rgba(255,255,255,.18) 88% 100%);
}
.tube::before{
  content:"";position:absolute;left:-2px;right:-2px;top:-3px;height:3px;
  border-radius:3px;background:var(--rim-strong);
}
.tube:focus-visible{outline:3px solid var(--focus);outline-offset:4px}
.tube.selected{transform:translateY(-16px)}
.tube.done{border-color:#59c07a}
.tube.nope{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.slot{height:40px;flex:0 0 40px}
.seg{
  height:40px;flex:0 0 40px;
  background:var(--c);
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.14), inset 0 5px 0 rgba(255,255,255,.18);
}
.seg:first-child{border-radius:0 0 20px 20px}
.seg.top{border-radius:14px 14px 0 0 / 7px 7px 0 0}
.seg.pour{animation:drop .26s cubic-bezier(.3,1.4,.6,1)}
@keyframes drop{from{transform:translateY(-150%);opacity:.3}to{transform:none;opacity:1}}

.controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
button{
  font:inherit;font-weight:500;font-size:14px;
  color:var(--ink);background:var(--panel);
  border:1px solid var(--rim);border-radius:11px;
  padding:9px 15px;cursor:pointer;
  transition:border-color .15s, transform .08s;
}
button:hover{border-color:var(--rim-strong)}
button:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button[disabled]{opacity:.42;cursor:not-allowed}
button.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.levels{display:flex;border:1px solid var(--rim);border-radius:11px;overflow:hidden}
.levels button{border:none;border-radius:0;padding:9px 14px;background:none}
.levels button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}

.win{
  position:absolute;inset:0;border-radius:20px;
  background:color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter:blur(3px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  text-align:center;
}
.win p{margin:0;font-size:20px;font-weight:700}
.win span{font-size:14px;color:var(--muted)}
.hint{text-align:center;font-size:13px;color:var(--muted);margin:0}

@media (max-width:420px){
  .tube{--w:44px}
  .slot,.seg{height:34px;flex-basis:34px}
  .board{gap:12px 10px;padding:22px 10px 16px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Пробирки<small>Разлей цвета по своим колбам</small></h1>
    <div class="stats">
      <div>ходы<b id="moves">0</b></div>
      <div>решено<b id="solved">0</b></div>
    </div>
  </header>

  <div class="board" id="board"></div>

  <div class="controls">
    <div class="levels" role="group" aria-label="Сложность">
      <button data-diff="easy" aria-pressed="false">Просто</button>
      <button data-diff="medium" aria-pressed="false">Средне</button>
      <button data-diff="hard" aria-pressed="false">Сложно</button>
    </div>
    <button id="undo">Отменить ход</button>
    <button id="restart">Заново</button>
    <button id="new" class="primary">Новый уровень</button>
  </div>

  <p class="hint">Нажми на пробирку, чтобы взять верхний цвет, потом на ту, куда переливаешь.</p>
</div>

<script>
const CAP = 4;
const COLORS = ["#e8453c","#f5a524","#2f9be0","#46c46f","#8b5cf6","#14b8a6","#ec4899","#a3621f","#64748b"];
const DIFF = { easy:{colors:4,empty:2}, medium:{colors:6,empty:2}, hard:{colors:9,empty:2} };

let diff = "easy";
let tubes = [];
let start = [];
let history = [];
let selected = null;
let moves = 0;
let solvedCount = 0;
let lastPour = null;   // {tube, count} — для анимации
let won = false;

/* ---------- правила ---------- */
const topOf = t => t[t.length-1];
const runLength = t => { let n=1; for(let i=t.length-2;i>=0 && t[i]===topOf(t);i--) n++; return t.length?n:0; };

function canPour(a,b){
  if(a===b) return false;
  const from=tubes[a], to=tubes[b];
  if(!from.length || to.length>=CAP) return false;
  return to.length===0 || topOf(to)===topOf(from);
}
function pour(a,b){
  const from=tubes[a], to=tubes[b];
  const n=Math.min(runLength(from), CAP-to.length);
  for(let i=0;i<n;i++) to.push(from.pop());
  return n;
}
const isSolved = st => st.every(t => t.length===0 || (t.length===CAP && t.every(c=>c===t[0])));

/* ---------- генератор: тасуем, пока не выйдет решаемая раскладка ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} }

function solvable(state){
  const key = s => s.map(t=>t.join(",")).sort().join("|");
  const seen = new Set([key(state)]);
  const stack = [state.map(t=>t.slice())];
  let nodes = 0;
  while(stack.length){
    if(++nodes > 120000) return false;
    const st = stack.pop();
    if(isSolved(st)) return true;
    const next = [];
    for(let i=0;i<st.length;i++){
      if(!st[i].length) continue;
      const c = st[i][st[i].length-1];
      let run=1; for(let k=st[i].length-2;k>=0 && st[i][k]===c;k--) run++;
      if(run===st[i].length && (st[i].length===CAP || st[i].length===0)) continue; // уже готова
      for(let j=0;j<st.length;j++){
        if(i===j || st[j].length>=CAP) continue;
        if(st[j].length && st[j][st[j].length-1]!==c) continue;
        if(!st[j].length && run===st[i].length) continue; // бессмысленный перенос
        const cp = st.map(t=>t.slice());
        const n = Math.min(run, CAP-cp[j].length);
        for(let x=0;x<n;x++) cp[j].push(cp[i].pop());
        const k2 = key(cp);
        if(seen.has(k2)) continue;
        seen.add(k2);
        // ход, который достраивает колбу до конца — самый перспективный
        next.push([cp[j].length===CAP?2:(st[j].length?1:0), cp]);
      }
    }
    next.sort((x,y)=>x[0]-y[0]);
    for(const [,s] of next) stack.push(s);
  }
  return false;
}

function generate(){
  const {colors, empty} = DIFF[diff];
  for(let attempt=0; attempt<300; attempt++){
    const pool=[];
    for(let c=0;c<colors;c++) for(let i=0;i<CAP;i++) pool.push(c);
    shuffle(pool);
    const st=[];
    for(let i=0;i<colors;i++) st.push(pool.slice(i*CAP,(i+1)*CAP));
    if(st.some(t=>t.every(c=>c===t[0]))) continue;   // без готовых колб на старте
    for(let i=0;i<empty;i++) st.push([]);
    if(solvable(st)) return st;
  }
  return null;
}

/* ---------- отрисовка ---------- */
const board = document.getElementById("board");

function render(){
  board.innerHTML = "";
  tubes.forEach((t,i)=>{
    const el = document.createElement("div");
    el.className = "tube";
    el.tabIndex = 0;
    el.setAttribute("role","button");
    el.setAttribute("aria-label", `Пробирка ${i+1}, заполнена на ${t.length} из ${CAP}`);
    if(selected===i) el.classList.add("selected");
    if(t.length===CAP && t.every(c=>c===t[0])) el.classList.add("done");
    for(let s=0;s<CAP;s++){
      const d = document.createElement("div");
      if(s < t.length){
        d.className = "seg" + (s===t.length-1 ? " top" : "");
        d.style.setProperty("--c", COLORS[t[s]]);
        if(lastPour && lastPour.tube===i && s >= t.length-lastPour.count) d.classList.add("pour");
      } else d.className = "slot";
      el.appendChild(d);
    }
    el.onclick = () => tap(i, el);
    el.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); tap(i, el); } };
    board.appendChild(el);
  });
  lastPour = null;
  document.getElementById("moves").textContent = moves;
  document.getElementById("solved").textContent = solvedCount;
  document.getElementById("undo").disabled = !history.length || won;
  if(won) showWin();
}

function tap(i, el){
  if(won) return;
  if(selected === null){
    if(tubes[i].length) { selected = i; render(); }
    return;
  }
  if(selected === i){ selected = null; render(); return; }
  if(canPour(selected, i)){
    history.push({state: tubes.map(t=>t.slice()), moves});
    if(history.length > 300) history.shift();
    const n = pour(selected, i);
    lastPour = {tube:i, count:n};
    moves++;
    selected = null;
    won = isSolved(tubes);
    if(won){ solvedCount++; save(); }
    render();
  } else {
    el.classList.remove("nope"); void el.offsetWidth; el.classList.add("nope");
    selected = tubes[i].length ? i : null;
    setTimeout(render, 320);
  }
}

function showWin(){
  const w = document.createElement("div");
  w.className = "win";
  w.innerHTML = `<p>Уровень пройден</p><span>Ходов: ${moves}</span>`;
  const b = document.createElement("button");
  b.className = "primary"; b.textContent = "Следующий уровень";
  b.onclick = newLevel;
  w.appendChild(b);
  board.appendChild(w);
  b.focus();
}

/* ---------- управление ---------- */
function newLevel(){
  const st = generate();
  if(!st){ alert("Не удалось собрать уровень, попробуй ещё раз"); return; }
  start = st.map(t=>t.slice());
  tubes = st;
  history = []; moves = 0; selected = null; won = false; lastPour = null;
  render();
}
function restart(){
  tubes = start.map(t=>t.slice());
  history = []; moves = 0; selected = null; won = false; lastPour = null;
  render();
}
document.getElementById("new").onclick = newLevel;
document.getElementById("restart").onclick = restart;
document.getElementById("undo").onclick = () => {
  const h = history.pop(); if(!h) return;
  tubes = h.state; moves = h.moves; selected = null; won = false;
  render();
};
document.querySelectorAll("[data-diff]").forEach(b=>{
  b.onclick = () => { diff = b.dataset.diff; save(); syncDiff(); newLevel(); };
});
function syncDiff(){
  document.querySelectorAll("[data-diff]").forEach(b=>
    b.setAttribute("aria-pressed", String(b.dataset.diff===diff)));
}

/* ---------- память браузера (у каждого своя, может быть пустой) ---------- */
function save(){
  try{ localStorage.setItem("tubes", JSON.stringify({diff, solvedCount})); }catch(e){}
}
try{
  const raw = localStorage.getItem("tubes");
  if(raw){ const d = JSON.parse(raw); if(DIFF[d.diff]) diff = d.diff; solvedCount = d.solvedCount|0; }
}catch(e){}

syncDiff();
newLevel();
</script>
</body>
</html>
